<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Atividade DOM</title>
</head>
<body>

  <h1>Atividade DOM</h1>

  <h2>Contador</h2>
  <button id="incrementar">+</button>
  <button id="decrementar">-</button>
  <span id="valor">0</span>

  <hr>

  <h2>Adicionar Texto</h2>
  <input type="text" id="inputTexto" placeholder="Digite e pressione Enter">
  <p>Caracteres (sem espaço): <span id="contadorCaracteres">0</span></p>

  <div id="paragrafos"></div>

  <hr>

  <h2>Adicionar Lista</h2>
  <select id="tipoLista">
    <option value="ul">Lista não ordenada</option>
    <option value="ol">Lista ordenada</option>
  </select>
  <button id="addLista">Adicionar Lista</button>

  <div id="listas"></div>

  <hr>

  <button id="reset">RESETAR TUDO</button>

  <script src="script.js"></script>

</body>
</html>
